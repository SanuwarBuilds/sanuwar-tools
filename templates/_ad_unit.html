{% macro ad_unit(slot) -%}
{% if adsense_client and slot %}
<aside class="ad-slot" aria-label="Advertisement">
<span class="ad-slot-label">Advertisement</span>
<ins class="adsbygoogle" style="display:block" data-ad-client="{{ adsense_client }}" data-ad-slot="{{ slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script nonce="{{ csp_nonce }}">(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
{% endif %}
{%- endmacro %}
