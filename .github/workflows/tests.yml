name: Tests

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check static/assets/js/tools/land-data.js
          node --check static/assets/js/tools/land-engine.js
          node --check static/assets/js/tools/land-i18n.js
          node --check static/assets/js/tools/land.js
          node --check static/assets/js/tools/calc-math.js
          node --check static/assets/js/tools/calculators.js
          node --check static/assets/js/tools/smart-search.js
          node --check static/assets/js/tools/hub.js
          node --check static/assets/js/tools/misc.js
          node --check static/assets/vendor/qrcodegen.js
      - name: Run land engine tests
        run: node tests/land_engine.test.cjs
      - name: Run i18n parity tests
        run: node tests/land_i18n.test.cjs
      - name: Run P0 calculation tests
        run: node tests/calc_math.test.cjs
      - name: Run smart search tests
        run: node tests/smart_search.test.cjs
